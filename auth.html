<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | GreenFarm</title><link rel="stylesheet" href="assets/style.css"><style>.auth{min-height:70vh;display:grid;place-items:center;padding:50px 5%}.auth-card{width:min(460px,100%);background:#fff;border:1px solid #dfe6e1;border-radius:14px;padding:32px;box-shadow:0 15px 40px rgba(0,55,30,.1)}.auth-card h1{color:#033b20}.auth-card p{color:#68746d}.auth-card label{display:block;font-size:13px;font-weight:700;margin:16px 0 6px}.auth-card input{width:100%;padding:12px;border:1px solid #ccd9d1;border-radius:8px;font:inherit}.auth-card button{width:100%;margin-top:20px}.msg{margin-top:14px;font-size:13px;color:#07552f}</style></head><body><header class="gf-header"><div class="gf-brand"><div class="gf-logo">🌱</div><div><div class="gf-name">GreenFarm</div><div class="gf-sub">SMART DIGITAL FARM MANAGEMENT SYSTEM</div></div></div></header><nav class="gf-nav"><a href="index.html">Home</a><a href="dashboard.html">Dashboard</a><a class="active" href="auth.html">Login</a></nav><main class="auth"><form class="auth-card" id="authForm"><small>FARMER ACCESS</small><h1>Welcome back</h1><p>Sign in to access your GreenFarm workspace.</p><label>Email</label><input id="email" type="email" required placeholder="farmer@example.com"><label>Password</label><input id="password" type="password" required minlength="6" placeholder="••••••••"><button class="btn2" type="submit">Sign In</button><div class="msg" id="msg"></div><p><a href="index.html">← Back to GreenFarm</a></p></form></main><footer class="gf-footer"><div><strong>🌱 GreenFarm</strong><p>Smart Digital Farm Management System</p></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>document.getElementById('authForm').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('msg');m.textContent='Database integration is ready; configure the publishable key in the project settings before sign-in.'});</script></body></html>
