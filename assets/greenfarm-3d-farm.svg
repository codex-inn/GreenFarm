<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
<title id="title">GreenFarm smart agriculture hero</title>
<desc id="desc">Illustrated smart farm landscape with green crop rows, tractor, drone, greenhouse, solar panel, irrigation sprinklers and hills at sunrise.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#7dc9d8"/><stop offset=".62" stop-color="#f9dba0"/><stop offset="1" stop-color="#f2e8bd"/></linearGradient>
 <linearGradient id="hill" x2="0" y2="1"><stop stop-color="#65a96c"/><stop offset="1" stop-color="#1d6544"/></linearGradient>
 <linearGradient id="field" x2="0" y2="1"><stop stop-color="#9bd76a"/><stop offset="1" stop-color="#24653d"/></linearGradient>
 <linearGradient id="tractor" x2="0" y2="1"><stop stop-color="#6bd14c"/><stop offset="1" stop-color="#18713b"/></linearGradient>
 <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#e7fff1" stop-opacity=".9"/><stop offset="1" stop-color="#70bca0" stop-opacity=".7"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#123d2a" flood-opacity=".25"/></filter>
 <pattern id="rows" width="66" height="36" patternUnits="userSpaceOnUse" patternTransform="skewY(-20)"><path d="M0 4H66" stroke="#d5f29a" stroke-width="8"/><path d="M12 17v-8m20 8v-8m20 8v-8" stroke="#236b3e" stroke-width="5" stroke-linecap="round"/></pattern>
</defs>
<rect width="1280" height="620" fill="url(#sky)"/>
<circle cx="1050" cy="105" r="49" fill="#fff1a9" opacity=".94"/><circle cx="1050" cy="105" r="72" fill="#fff4c5" opacity=".25"/>
<path d="M0 280 145 155 255 240 420 105 570 235 730 135 890 260 1045 160 1280 265V620H0Z" fill="#7ab88b"/>
<path d="M0 335 185 220 330 315 510 195 690 325 870 220 1040 325 1190 235 1280 290V620H0Z" fill="url(#hill)"/>
<path d="M0 382Q170 330 320 385T640 378T960 378T1280 350V620H0Z" fill="#2d7146"/>
<g opacity=".9" fill="#164f37"><path d="M20 300q22-55 44 0v-40q30-55 55 0v60H20z"/><path d="M1150 290q22-55 44 0v-40q30-55 55 0v60h-99z"/></g>
<!-- field beds -->
<path d="M0 410 575 300 1280 405V620H0Z" fill="url(#field)"/>
<path d="M0 445 575 330 1280 438V620H0Z" fill="url(#rows)" opacity=".96"/>
<path d="M0 490 575 372 1280 482" fill="none" stroke="#b6e879" stroke-width="9" opacity=".8"/>
<!-- farmhouse -->
<g transform="translate(800 285)" filter="url(#shadow)"><path d="M0 66 88 0 180 66V150H0Z" fill="#f8eed2"/><path d="M-12 68 88-8 192 68 177 78 88 15 4 78Z" fill="#b9573e"/><rect x="68" y="85" width="39" height="65" rx="3" fill="#82543b"/><rect x="20" y="84" width="32" height="28" fill="#8dd4dc"/><rect x="125" y="84" width="32" height="28" fill="#8dd4dc"/></g>
<!-- greenhouse -->
<g transform="translate(1000 320)" filter="url(#shadow)"><path d="M0 95V38Q76-25 150 38V95Z" fill="url(#glass)" stroke="#e7fff5" stroke-width="7"/><path d="M0 58H150M36 15V95M75 0V95M114 15V95" stroke="#f1fff6" stroke-width="5" opacity=".9"/><path d="M0 95H150" stroke="#174f3a" stroke-width="9"/></g>
<!-- tractor -->
<g transform="translate(115 320)" filter="url(#shadow)">
 <circle cx="87" cy="164" r="43" fill="#18392c"/><circle cx="87" cy="164" r="25" fill="#c6c8a6"/><circle cx="87" cy="164" r="12" fill="#4c7054"/>
 <circle cx="190" cy="170" r="29" fill="#18392c"/><circle cx="190" cy="170" r="16" fill="#c6c8a6"/>
 <path d="M42 102H185L210 139H35Z" fill="url(#tractor)"/><path d="M106 36H173L192 105H97Z" fill="#2c8a4a" stroke="#145a35" stroke-width="6"/><path d="M116 46H159L170 87H111Z" fill="#8dd5df" stroke="#e4fff5" stroke-width="5"/><path d="M93 92H179V120H93Z" fill="#43b841"/><path d="M31 117H94L108 143H20Z" fill="#3ba842"/><rect x="14" y="136" width="43" height="10" rx="4" fill="#f5d45f"/><path d="M191 105h28l14 32h-37Z" fill="#18713b"/><rect x="132" y="22" width="6" height="17" fill="#234b35"/><circle cx="136" cy="20" r="5" fill="#ffdf70"/>
</g>
<!-- irrigation pipes and water arcs -->
<path d="M0 540Q240 508 465 548T930 540T1280 545" fill="none" stroke="#83d9ed" stroke-width="7" opacity=".95"/>
<g stroke="#b4f3ff" stroke-width="4" fill="none" stroke-linecap="round"><path d="M445 512q-18-45 0-72m0 72q18-45 0-72"/><path d="M700 527q-18-48 0-76m0 76q18-48 0-76"/><path d="M925 534q-18-44 0-69m0 69q18-44 0-69"/></g>
<g fill="#c5f6ff"><circle cx="427" cy="453" r="4"/><circle cx="455" cy="460" r="4"/><circle cx="682" cy="465" r="4"/><circle cx="718" cy="463" r="4"/><circle cx="909" cy="476" r="4"/><circle cx="943" cy="477" r="4"/></g>
<!-- solar panel -->
<g transform="translate(1120 432)"><path d="M28 70 40 17M88 75 81 17" stroke="#e3ead7" stroke-width="7"/><path d="M0 8 90 0 110 44 20 53Z" fill="#174f6d" stroke="#d5f0f5" stroke-width="5"/><path d="M30 5 48 49M58 3 75 47M10 27 99 18" stroke="#75c6df" stroke-width="3"/></g>
<!-- drone -->
<g transform="translate(885 145)" stroke="#204c3b" stroke-width="5" stroke-linecap="round" fill="#edf6e4"><path d="M-45 0H45M-18 0 0 15 18 0"/><rect x="-17" y="-10" width="34" height="20" rx="8" fill="#f8fff0"/><path d="M-40 0l-18-13m98 13 18-13" fill="none"/><ellipse cx="-60" cy="-15" rx="28" ry="4" fill="#e7f8ee"/><ellipse cx="60" cy="-15" rx="28" ry="4" fill="#e7f8ee"/><path d="M0 15v18" fill="none"/><circle cx="0" cy="35" r="5" fill="#f7cb60"/></g>
<!-- subtle smart sensor -->
<g transform="translate(730 390)"><path d="M0 52V0" stroke="#e7f8e9" stroke-width="7"/><rect x="-17" y="-5" width="34" height="24" rx="6" fill="#174f3a" stroke="#a7e66c" stroke-width="3"/><path d="M-7 6q7-9 14 0q-7 9-14 0Z" fill="#a6e956"/><circle cx="0" cy="7" r="3" fill="#e7ffd0"/></g>
<!-- GreenFarm label -->
<g font-family="Arial,Helvetica,sans-serif"><rect x="42" y="34" width="465" height="105" rx="24" fill="#123f2e" fill-opacity=".91"/><path d="M75 100q-6-34 8-49 22 17 14 37 12-25 34-28-2 30-33 40l-3 17" fill="#9be64c"/><text x="145" y="86" font-size="42" font-weight="700" fill="#fff">Green<tspan fill="#f6d86d">Farm</tspan></text><text x="147" y="115" font-size="14" letter-spacing="2.3" fill="#e0f6e4">SMART DIGITAL FARM MANAGEMENT</text></g>
<rect x="0" y="596" width="1280" height="24" fill="#103d2c" opacity=".65"/>
</svg>